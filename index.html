<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Algo Eco Sim은 정렬·길찾기 시각화와 생태계 시뮬을 함께 배우는 정보·과학 도구입니다." />
    <meta name="theme-color" content="#07120e" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Algo Eco Sim — 알고리즘 & 생태계 시뮬</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #07120e; color: #e9f4ec; }
      .boot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 10px; background: radial-gradient(circle at 50% 42%, #10261e 0%, #07120e 62%, #030806 100%); font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
      .boot-title { margin: 0; font-size: 24px; font-weight: 800; }
      .boot-sub { margin: 0; color: #93b8a4; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" class="boot" role="status" aria-live="polite">
      <p class="boot-title">Algo Eco Sim</p>
      <p class="boot-sub">알고리즘 & 생태계 시뮬을 준비하고 있습니다</p>
    </div>
    <noscript><div style="position: fixed; inset: 0; display: grid; place-content: center; padding: 24px">사용하려면 JavaScript를 허용해야 합니다.</div></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
